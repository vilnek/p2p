<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0E1A" />
    <meta name="referrer" content="no-referrer" />
    <!-- 'wasm-unsafe-eval': only for the bundled Argon2id WebAssembly (chat lock); eval() stays blocked.
         No outside scripts, styles or fonts. The only network connections allowed are the built-in public
         relays (one-scan connect) and local test relays. WebRTC is not covered by connect-src.
         frame-src: only YouTube's privacy-enhanced player, for the home page video, loaded only when Play is pressed. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: mediastream:; connect-src wss://relay.damus.io wss://nos.lol wss://relay.primal.net wss://offchain.pub wss://nostr.mom ws://127.0.0.1:* ws://localhost:*; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'none'"
    />
    <title>P2P Talk</title>
  </head>
  <body>
    <main id="app"></main>
    <!-- The gradient for the selected tab icon (design P2). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><linearGradient id="p2p-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF" /><stop offset="1" stop-color="#8B5CF6" /></linearGradient></defs></svg>
    <!-- Start animation (design: brand/splash.html). Removes itself after ~3 s; tap to skip. -->
    <div id="p2p-splash" role="img" aria-label="P2P Talk by Vilnek">
      <div class="glow"></div>
      <div class="stack">
        <svg viewBox="140 260 700 600" aria-hidden="true">
          <defs>
            <linearGradient id="sp-line" gradientUnits="userSpaceOnUse" x1="364" y1="0" x2="426" y2="0"><stop offset="0" stop-color="#00F2FE" /><stop offset="1" stop-color="#8B5CF6" /></linearGradient>
            <filter id="sp-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" /></filter>
          </defs>
          <circle class="ring" cx="395" cy="445" r="150" />
          <circle class="ring r2" cx="395" cy="445" r="150" />
          <path class="b1" d="M250 300h300a90 90 0 0 1 90 90v110a90 90 0 0 1-90 90H420l-120 100V590h-50a90 90 0 0 1-90-90V390a90 90 0 0 1 90-90z" />
          <path class="b2" d="M700 440h20a90 90 0 0 1 90 90v110a90 90 0 0 1-90 90h-30v100L570 730h-60" />
          <path class="link" d="M364 445h62" />
          <circle class="d1" cx="330" cy="445" r="34" />
          <circle class="d2" cx="460" cy="445" r="34" />
          <circle class="spark" cx="364" cy="445" r="10" />
        </svg>
        <div class="word">P2P Talk</div>
        <div class="tag">Talk directly, device to device</div>
      </div>
      <div class="by">OPEN SOURCE · BY <b>VILNEK</b></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
